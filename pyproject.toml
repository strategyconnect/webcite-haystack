[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "webcite-haystack"
version = "0.1.0"
description = "Haystack components for Webcite: parse documents to Markdown, search sources, and verify claims with citations bound to source passages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Webcite" }]
keywords = ["haystack", "webcite", "pdf-to-markdown", "document-parsing", "ocr", "claim-verification", "fact-checking", "citations", "web-search", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["haystack-ai>=2.9.0,<3.0.0", "webcite>=0.1.0,<0.2.0"]

[project.urls]
Homepage = "https://webcite.co"
Documentation = "https://github.com/strategyconnect/webcite-haystack#readme"
Repository = "https://github.com/strategyconnect/webcite-haystack"
Issues = "https://github.com/strategyconnect/webcite-haystack/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-socket>=0.7", "ruff>=0.5", "mypy>=1.10"]

# Until `webcite` is on PyPI, development installs take it from its public repository.
# Built wheels and sdists carry only the version requirement above.
[tool.uv.sources]
webcite = { git = "https://github.com/strategyconnect/webcite-python", rev = "9c144346a111c354fc7d11322bac03d56e6659d1" }

[tool.hatch.build.targets.wheel]
packages = ["src/haystack_integrations"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "Makefile"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
explicit_package_bases = true
mypy_path = "src"
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
